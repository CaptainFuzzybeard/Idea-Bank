<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideas</title>
<style>
:root{--t1:#e2dac2;--t2:#f39120;--t3:#4fbbbc;--t4:#ec4624;--on:#2b2d38;--fb:rgba(255,255,255,.6);--hv:rgba(255,255,255,.3);--bg:#f4f3f1;--card:#f9f8f6;--fg:#3b3b41;--mu:#8b8b91;--ln:#e5e3e0;--sf:#ebe9e6;--ink:#4b4b52;--ink-t:#f4f3f1;--glow:rgba(110,108,120,.16);--sh:0 10px 28px rgba(60,55,50,.08);--tb:rgba(59,59,65,.94);--tf:#f4f3f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--fg:#e8e8ed;--mu:#98989d;--ln:#2c2c2e;--sf:#1c1c1e;--ink:#d8d8dd;--ink-t:#000;--glow:rgba(200,200,215,.14);--sh:0 10px 28px rgba(0,0,0,.5);--tb:rgba(232,232,237,.94);--tf:#000;--t1:#e2dac2;--t2:#f39120;--t3:#4fbbbc;--t4:#ec4624;--on:#2b2d38;--fb:rgba(255,255,255,.55);--hv:rgba(255,255,255,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--fg:#e8e8ed;--mu:#98989d;--ln:#2c2c2e;--sf:#1c1c1e;--ink:#d8d8dd;--ink-t:#000;--glow:rgba(200,200,215,.14);--sh:0 10px 28px rgba(0,0,0,.5);--tb:rgba(232,232,237,.94);--tf:#000;--t1:#e2dac2;--t2:#f39120;--t3:#4fbbbc;--t4:#ec4624;--on:#2b2d38;--fb:rgba(255,255,255,.55);--hv:rgba(255,255,255,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(48px,11vh) 24px 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease,color .2s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:12px}
h1{font-size:clamp(34px,8vw,48px);letter-spacing:-.04em;line-height:1.08;font-weight:600;margin:0 0 32px}
#home{padding-top:max(0px,12vh)}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:12px 12px 12px 28px;box-shadow:var(--sh);transition:box-shadow .3s ease}
.card:focus-within{box-shadow:var(--sh),0 0 0 5px var(--glow)}
.cap{flex:1;min-width:0;border:0;background:none;padding:14px 0;font-size:clamp(20px,5vw,24px);letter-spacing:-.015em;outline:0}
.cap::placeholder{color:var(--mu)}
.send{width:46px;height:46px;border-radius:50%;background:var(--ln);color:var(--mu);display:grid;place-items:center;flex:none}
.send.on{background:var(--ink);color:var(--ink-t)}
.send.on:hover{transform:scale(1.08)}
.kind{display:grid;gap:10px;margin:18px 0 0 6px;opacity:0;transform:translateY(-4px);visibility:hidden;transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
.kind.on{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.kind span{font-size:13px;color:var(--mu);margin-right:6px}
.chip{border-radius:980px;padding:6px 14px;font-size:14px;color:var(--mu);background:var(--sf)}
.chip:hover{color:var(--fg);transform:translateY(-1px)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ink-t)}
.saved{min-height:24px;margin:10px 0 0 4px;font-size:14px;color:var(--mu)}
.foot{margin:72px 0 0 6px}
.foot .link{font-size:16px}
.foot .link svg{transition:transform .2s ease}
.foot .link:hover svg{transform:translateX(3px)}
.bar{display:flex;gap:4px}
.bar button{flex:1;padding:7px 2px;font-size:12px;border-radius:8px;background:var(--sf);color:var(--mu)}
.bar button.on{background:var(--ink);color:var(--ink-t)}
.bar button:disabled{cursor:default}
.gate{font-size:14px;color:var(--mu);display:grid;gap:4px}
.gate b{font-weight:400;color:var(--fg)}
[hidden]{display:none!important}
.tag{flex:none;font-style:normal;font-size:12px;color:var(--mu)}
#srchb::after{--tx:0;left:auto;right:0}
.still{margin:44px 0 0 6px;max-width:440px}
.still .l2{font-size:13px;color:var(--mu);margin:0 0 6px}
.still .idea{margin:0 0 10px;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.still .a2{display:flex;gap:20px}
#pr{display:grid;gap:8px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q{margin:0;font-size:15px;color:var(--mu)}
.qrow .link{font-size:13px}
.ans{text-align:left;font-size:14px;color:var(--mu);padding:2px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans:hover{color:var(--fg)}
#pr textarea{width:100%;border:0;background:var(--sf);border-radius:16px;padding:12px 16px;font-size:16px;outline:0;resize:none;transition:box-shadow .2s ease}
#pr textarea:hover{box-shadow:0 0 0 1px var(--mu)}
#pr textarea:focus{box-shadow:0 0 0 2px var(--fg)}
main{position:relative;z-index:1}

#bg[data-st=spark]{--c:var(--t2)}#bg[data-st=seed]{--c:var(--t3)}#bg[data-st=inbox]{--c:var(--fg)}
#bg[data-on][data-st=spark]{--rc:var(--t2)}#bg[data-on][data-st=seed]{--rc:var(--t3)}
#bg[data-on]{--sr:32vmin}
.rings{position:absolute;left:50%;top:52%;height:125vmin;aspect-ratio:736/817;transform:translate(-50%,-50%) translate(var(--tx,0px),var(--ty,0px)) rotate(var(--rot,0deg))}
.rg{position:absolute;inset:0;display:block;-webkit-mask:var(--ring) center/100% 100% no-repeat;mask:var(--ring) center/100% 100% no-repeat}
.r0{background:var(--fg);opacity:.11}
.spot{position:absolute;inset:0;-webkit-mask-image:radial-gradient(circle var(--sr,22vmin) at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:radial-gradient(circle var(--sr,22vmin) at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.55) 45%,transparent 100%)}
.r1{background:var(--rc,var(--fg));opacity:.55;transition:background-color .8s ease}
.nr{position:absolute;left:43.5%;top:54%;width:18%;aspect-ratio:1;margin:-9% 0 0 -9%;border-radius:50%;border:2px solid var(--c,var(--fg));animation:nr 2.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes nr{from{transform:scale(.12);opacity:.9}to{transform:scale(4.6);opacity:0}}
.more{display:flex;gap:24px;margin:72px 0 0 8px}
.what:empty{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;min-height:32px}
.grp{display:flex;gap:20px}
.link{color:var(--mu);font-size:15px;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--fg)}
.seg{display:flex;background:var(--sf);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:13px;color:var(--mu);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected=true]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.what{color:var(--mu);font-size:14px;margin:0 0 8px 2px}
.item{border-radius:20px;margin:0 0 10px;background:var(--c);color:var(--on);transition:background-color .3s ease}

.cls,.acts{display:flex;gap:6px;flex-wrap:wrap}
.b{background:var(--sf);border-radius:980px;padding:10px 20px;font-size:15px;font-weight:500}
.b.p{background:var(--ink);color:var(--ink-t)}
.b:hover{transform:translateY(-1px);box-shadow:var(--sh)}

.empty{display:grid;justify-items:center;gap:16px;color:var(--mu);padding:56px 0;text-align:center}
.sync{margin:64px 0 0;text-align:center;font-size:12px;color:var(--mu);min-height:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--tb);color:var(--tf);border-radius:980px;padding:10px 12px 10px 20px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:30;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translate(var(--tx,-50%),4px);width:max-content;max-width:220px;background:var(--tb);color:var(--tf);font:400 12px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:0;text-align:left;padding:7px 11px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:20}
@media (hover:hover){[data-tip]:hover::after{opacity:1;transform:translate(var(--tx,-50%),0);transition-delay:.35s}}
[data-tip]:focus-visible::after{opacity:1;transform:translate(var(--tx,-50%),0)}
.kind .chip:nth-child(2)::after,#back::after{--tx:0;left:0}
.row::after{--tx:0;left:8px}
@media (prefers-reduced-motion:no-preference){
#home h1{animation:u .8s cubic-bezier(.2,.8,.2,1) backwards}.card{animation:u .8s .12s cubic-bezier(.2,.8,.2,1) backwards}.foot{animation:o 1.2s .6s ease backwards}
@keyframes u{from{transform:translateY(10px);opacity:0}}
.detail{animation:o .2s ease}@keyframes o{from{opacity:0}}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main>
<section id="home">
<h1>What’s on your mind?</h1>
<div class="card"><input class="cap" id="cap" placeholder="A new idea" autocomplete="off" aria-label="New idea" enterkeyhint="done"><button class="send" id="send" tabindex="-1" data-tip="Save this idea" aria-label="Save idea"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
<div class="kind" id="kind"><div id="pr"></div></div>
<p class="saved" id="sv" aria-live="polite"></p>
<div class="still" id="still" hidden></div>
<div class="foot" style="display:flex;gap:24px;align-items:center"><button class="link" data-go="thoughts" data-tip="See everything you’ve saved">Library <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></button></div>
</section>
<section id="lib" hidden>
<div class="top"><button class="link" id="back" data-tip="Back to home"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 8l6 6"/></svg>Back</button><button class="link" id="srchb" data-tip="Search your ideas" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
<div class="f" id="sbox" hidden style="margin-bottom:14px"><input id="q" placeholder="Search your ideas" autocomplete="off" aria-label="Search your ideas"></div>
<div class="seg" id="nav" role="tablist"></div>
<p class="what" id="what"></p>
<section id="list"></section>
<div class="more"><button class="link" data-go="dropped" data-tip="Ideas you let go, kept safe">Dropped</button><button class="link" id="expb" data-tip="Save a copy of all your ideas">Export</button></div>

</section>
<p class="sync" id="sync" aria-live="polite"></p>
</main>
<div id="toast" role="status"><span id="tm"></span><button id="tu">Undo</button></div>
<script>
var ST=[["inbox","Thought","Thoughts","Just captured, not yet decided.","Just a thought","thoughts"],["spark","Spark","Sparks","Interesting, not ready yet.","Not ready yet","sparks"],["seed","Seed","Seeds","Ideas with a clear shape.","Has a shape","seeds"],["project","Project","Projects","Ideas you are building.","Being built","projects"],["drop","Drop","Dropped","Let go, and kept safe.","Let it go","dropped"]];
var IC={inbox:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',spark:'<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',seed:'<path d="M12 21v-8M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 16c0-3-2-5-6-5 0 3 2 5 6 5z"/>',project:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>'};
var CH='<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>';
var S={q:"",searching:false,items:[],view:"home",tab:"inbox",kind:"inbox",open:null,warn:null,loading:!!window.claude};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function live(){return S.items.filter(function(i){return !i.del})}
function by(st){return live().filter(function(i){return i.s===st}).sort(function(a,b){return b.u-a.u})}
function find(id){return S.items.filter(function(x){return x.id===id})[0]}
var D={s:"inbox",moment:"",why:"",small:"",qs:"",next:""},P={step:0,v:0};
var PR=[{k:"moment",ph:"The moment…",q:["What’s the moment this is really about?","Which single moment is this about?","If this were one scene, what would it be?"]},{k:"small",ph:"The smallest version…",q:["What could you make this weekend?","What’s the tiniest honest version of this?","What would a first version look like?"]},{k:"qs",ph:"Open questions…",q:["What don’t you know yet?","What are you unsure about?","What would you need to find out?"]}];
function words(){return $("#cap").value.trim().split(/\s+/).filter(Boolean).length}
function paintStage(){var b=$("#bg");if(!b)return;b.dataset.st=D.s;if($("#cap").value.trim())b.setAttribute("data-on","");else b.removeAttribute("data-on")}
function paintDraft(){paintStage();var c=document.querySelector(".card");if($("#cap").value.trim())c.dataset.st=D.s;else c.removeAttribute("data-st")}
function paintPrompt(){var h="",n;for(n=0;n<P.step&&n<PR.length;n++){var a=D[PR[n].k];if(a.trim())h+='<button class="ans" data-back="'+n+'" data-tip="Edit this answer">'+esc(a)+'</button>'}
  if(P.step<PR.length){var q=PR[P.step];h+='<div class="qrow"><p class="q">'+q.q[P.v%3]+'</p><button class="link" data-skip="1">Skip</button></div><textarea id="pi" data-d="'+q.k+'" rows="2" placeholder="'+q.ph+'">'+esc(D[q.k])+'</textarea>'}
  $("#pr").innerHTML=h}
function advance(){P.step++;paintPrompt();var n=$("#pi");if(n)n.focus()}
function resetDraft(){D={s:"inbox",moment:"",why:"",small:"",qs:"",next:""};P={step:0,v:Math.floor(Math.random()*3)};paintPrompt();paintDraft()}
var FIELDS=["moment","why","small","qs","next","links","decisions","thing","dropwhy"];
function rel(t){var d=Math.floor((Date.now()-t)/864e5);return d<1?"Today":d==1?"Yesterday":d<7?d+"d":d<30?Math.floor(d/7)+"w":d<365?Math.floor(d/30)+"mo":Math.floor(d/365)+"y"}
function fmt(t){return new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function meta(i){var n=days(i);return "Added "+fmt(i.c)+(n>1?" · Revisited on "+n+" days":"")}
function listFor(){
  if(S.searching){var q=S.q.trim().toLowerCase();if(!q)return[];return live().filter(function(i){return [i.t,i.moment,i.why,i.small,i.qs,i.next,i.links,i.decisions,i.thing].join(" ").toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.u-a.u})}
  if(S.tab==="inbox")return live().filter(function(i){return i.s!=="drop"}).sort(function(a,b){return b.u-a.u});
  return by(S.tab)}
function tagFor(i){return rel(i.c)}
function stale(){var n=Date.now(),c=live().filter(function(i){return i.s in ORD&&n-Math.max(i.u,i.look)>12096e5}).sort(function(a,b){return Math.max(a.u,a.look)-Math.max(b.u,b.look)});return c.length?c[Math.floor(n/864e5)%c.length]:null}
function toggleSearch(on){S.searching=on;$("#sbox").hidden=!on;if(on)$("#q").focus();else{S.q="";$("#q").value=""}S.open=null;render()}
function norm(i){if(i.look==null)i.look=0;FIELDS.forEach(function(k){if(i[k]==null)i[k]=""});i.days=i.days||[];i.status=i.status||"building";return i}
var ORD={inbox:0,spark:1,seed:2};
function auto(i){return i.moment.trim()&&i.small.trim().length>=10?"seed":(i.moment.trim()||i.pair)?"spark":"inbox"}
function bump(i){if(i.s in ORD){var a=auto(i);if(ORD[a]>ORD[i.s]){i.s=a;return true}}return false}
function today(){return new Date().toISOString().slice(0,10)}
function touchDay(i){var d=today();if(i.days.indexOf(d)<0){i.days.push(d);i.u=Date.now();return true}return false}
function days(i){var o={};i.days.forEach(function(d){o[d]=1});o[new Date(i.c).toISOString().slice(0,10)]=1;return Object.keys(o).length}
function building(){return live().filter(function(x){return x.s==="project"&&x.status==="building"}).length}
function barHtml(i){var cur={inbox:0,spark:1,seed:2,project:3}[i.s];return ["inbox","spark","seed","project"].map(function(k,n){var x=stg(k);return '<button class="'+(n<=cur?"on":"")+'" data-mv="'+k+'"'+(k==="project"?" disabled":"")+' data-tip="'+(k==="project"?"Start it with the button below":"Move to "+x[1].toLowerCase()+". "+x[3])+'">'+x[1]+'</button>'}).join("")}
function gateHtml(i){if(i.s!=="seed")return"";var c=[[i.small.trim().length>=10,"Smallest version written"],[days(i)>=2,"Revisited on two separate days ("+days(i)+" so far)"],[!!i.next.trim(),"First thing to build is known"],[building()<3,"Fewer than three projects in progress"]],ok=c.every(function(x){return x[0]});return '<div class="gate">'+c.map(function(x){return '<span>'+(x[0]?"●":"○")+' <b>'+x[1]+'</b></span>'}).join("")+'</div><div class="acts" style="margin-top:14px"><button class="b p" data-start="1">'+(ok?"Start project":"Start anyway")+'</button></div>'}
function paint(box,i){if(!box.querySelector("#bar"))return;box.querySelector("#bar").innerHTML=barHtml(i);box.querySelector("#gate").innerHTML=gateHtml(i)}
function fld(k,l,i,ta){return '<div class="f"><label>'+l+'</label>'+(ta?'<textarea data-k="'+k+'" rows="2">'+esc(i[k])+'</textarea>':'<input data-k="'+k+'" value="'+esc(i[k])+'">')+'</div>'}
function stg(k){return ST.filter(function(x){return x[0]===k})[0]}
function merge(a,b){var m={};a.concat(b).forEach(function(x){var y=m[x.id];if(!y||(x.u||0)>(y.u||0))m[x.id]=x});return Object.keys(m).map(function(k){return norm(m[k])})}
try{var L=JSON.parse(localStorage.getItem("ideas")||"null");if(L)S.items=(L.items||[]).map(norm)}catch(e){}
var ref=null,timer=null,retry=null;
function setSync(t){$("#sync").textContent=t}
function local(){try{localStorage.setItem("ideas",JSON.stringify({items:S.items}))}catch(e){}}
function save(){local();if(!ref){setSync(window.claude?"Saved on this device":"Saved on this device");return}setSync("Saving…");clearTimeout(timer);timer=setTimeout(sync,500)}
function typing(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.closest&&a.closest(".detail")}
function sync(){
  if(!ref)return Promise.resolve();
  return ref.get().then(function(snap){
    var before=JSON.stringify(S.items),rem=snap.exists?(snap.data().items||[]):[];
    S.items=merge(S.items,rem);
    var changed=JSON.stringify(S.items)!==before;local();
    return ref.set({items:S.items,upd:Date.now()}).then(function(){setSync("Saved");if(changed&&!typing())render()})
  }).catch(function(){setSync("Saved on this device. Will retry.");clearTimeout(retry);retry=setTimeout(sync,15000)})
}
function add(text,s){text=text.trim();if(!text)return;var n=Date.now();S.items.push(norm({id:n+""+Math.floor(Math.random()*1e4),t:text,s:s||"inbox",c:n,u:n}))}
function say(t){var v=$("#sv");v.textContent=t;clearTimeout(window._s);window._s=setTimeout(function(){v.textContent=""},2000)}
var undoFn=null,tt=null;
function toast(msg,fn){undoFn=fn;$("#tm").textContent=msg;$("#tu").hidden=!fn;$("#toast").classList.add("on");clearTimeout(tt);tt=setTimeout(function(){$("#toast").classList.remove("on");undoFn=null},7000)}
function go(h){location.hash=h;route()}
function route(){
  S.searching=false;S.q="";$("#sbox").hidden=true;$("#q").value="";
  var h=location.hash.slice(1),f=ST.filter(function(x){return x[5]===h})[0];
  if(f){S.view="lib";S.tab=f[0]}else S.view="home";
  S.open=null;S.warn=null;render();scrollTo(0,0);if(S.view==="home"&&matchMedia("(hover:hover)").matches)$("#cap").focus()
}
function render(){
  $("#home").hidden=S.view!=="home";paintBg();$("#lib").hidden=S.view!=="lib";
  $("#nav").innerHTML=ST.slice(0,4).map(function(t){return '<button role="tab" data-tip="'+(t[0]==="inbox"?"Everything you’ve captured, at every stage.":t[3])+'" data-go="'+t[5]+'" aria-selected="'+(S.tab===t[0])+'">'+t[2]+'</button>'}).join("");
  $("#what").textContent=S.searching?"":S.tab==="drop"?stg("drop")[3]:"";
  var list=listFor(),h="";$("#nav").hidden=S.searching;var st=stale(),sl=$("#still");if(st){sl.hidden=false;sl.dataset.sid=st.id;sl.innerHTML='<p class="l2">Still interested?</p><p class="idea">'+esc(st.t)+'</p><div class="a2"><button class="link" data-still="keep" data-tip="Ask me again in two weeks">Keep</button><button class="link" data-still="open" data-tip="Open this idea">Open</button><button class="link" data-still="drop" data-tip="Move it to Dropped">Let go</button></div>'}else sl.hidden=true;
  if(!list.length)h='<div class="empty">'+(S.loading?"Loading your ideas…":S.searching?(S.q.trim()?"No matches.":"Type to search every idea."):"Nothing here yet.")+'</div>';
  list.forEach(function(i){
    var o=S.open===i.id;
    h+='<div class="item s-'+i.s+'"><button class="row" data-tip="'+stg(i.s)[1]+'. Open to edit or reclassify" data-open="'+i.id+'" aria-expanded="'+o+'"><span>'+esc(i.t||"Untitled")+(i.s==="project"&&i.status!=="building"?" · "+i.status[0].toUpperCase()+i.status.slice(1):"")+'</span><em class="tag">'+tagFor(i)+'</em></button>'+(o?detail(i):'')+'</div>'
  });
  $("#list").innerHTML=h
}
function detail(i){
  var h='<div class="detail" data-id="'+i.id+'">',del='<button class="b" data-tip="Delete this idea. Tap twice to confirm." data-del="1">Delete</button>';
  if(i.s==="drop")return h+fld("t","Idea",i)+fld("dropwhy","Why you let it go (optional)",i)+'<div class="acts"><button class="b p" data-mv="restore">Restore</button>'+del+'</div></div>';
  h+='<div class="bar" id="bar">'+barHtml(i)+'</div><p class="note" id="hint"></p>'+fld("t","Idea",i)+fld("moment","The moment this is about",i)+fld("why","Why now, and why you",i)+fld("small","Smallest version, buildable in a weekend",i,1)+fld("qs","Open questions",i,1)+fld("next",i.s==="project"?"Next step":"First thing to build",i);
  h+='<div class="f"><label>Pairs well with</label><select data-k="pair"><option value="">Nothing yet</option>'+live().filter(function(x){return x.id!==i.id}).map(function(x){return '<option value="'+x.id+'"'+(i.pair===x.id?" selected":"")+'>'+esc(x.t.slice(0,48))+'</option>'}).join("")+'</select></div>'+fld("links","Links and references",i);
  if(i.s==="project")h+='<div class="f"><label>Status</label><div class="cls">'+[["building","Building"],["parked","Parked"],["shipped","Shipped"]].map(function(x){return '<button class="chip" data-ps="'+x[0]+'" aria-pressed="'+(i.status===x[0])+'">'+x[1]+'</button>'}).join("")+'</div></div>'+fld("decisions","Decisions so far",i,1)+fld("thing","Link to the thing you made",i);
  return h+'<p class="note">'+meta(i)+'</p><div id="gate">'+gateHtml(i)+'</div><div class="acts"><button class="b" data-mv="drop" data-tip="Let it go. It is kept safe.">Drop</button>'+del+'</div></div>'
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.skip){advance()}
  else if(t.dataset.back){P.step=+t.dataset.back;paintPrompt();var bi=$("#pi");if(bi)bi.focus()}
  else if(t.dataset.go){go(t.dataset.go)}
  else if(t.dataset.open){var oi=find(t.dataset.open);if(oi&&touchDay(oi))save();S.open=S.open===t.dataset.open?null:t.dataset.open;S.warn=null;render()}
  else if(t.id==="srchb"){toggleSearch(!S.searching)}
  else if(t.dataset.still){var sx=find($("#still").dataset.sid);if(!sx)return;var how=t.dataset.still;
    if(how==="keep"){sx.look=Date.now();sx.u=Date.now();save();render()}
    else if(how==="open"){go("thoughts");S.open=sx.id;touchDay(sx);render()}
    else{var sp2=sx.s;sx.s="drop";sx.u=Date.now();save();render();toast("Let go",function(){sx.s=sp2;sx.u=Date.now();save();render()})}}
  else if(t.dataset.start){var si=find(t.closest(".detail").dataset.id),sp=si.s;si.s="project";si.status="building";si.u=Date.now();S.open=null;save();render();toast("Project started",function(){si.s=sp;si.u=Date.now();save();render()})}
  else if(t.dataset.ps){var pi=find(t.closest(".detail").dataset.id);pi.status=t.dataset.ps;pi.u=Date.now();save();render()}
  else if(t.dataset.mv){
    var id=t.closest(".detail").dataset.id,i=find(id),to=t.dataset.mv,prev=i.s;
    if(to==="restore")to=auto(i);if(to===prev)return;
    i.s=to;i.u=Date.now();S.open=null;S.warn=null;save();render();
    toast("Moved to "+stg(to)[2].toLowerCase(),function(){i.s=prev;i.u=Date.now();save();render()})
  }
  else if(t.dataset.del){if(t.dataset.sure){var d=find(t.closest(".detail").dataset.id);d.del=true;d.u=Date.now();S.open=null;save();render()}else{t.dataset.sure=1;t.textContent="Delete for good"}}
  else if(t.id==="back"){go("")}
  else if(t.id==="expb"){exportAll()}
  else if(t.id==="tu"){var f=undoFn;undoFn=null;$("#toast").classList.remove("on");if(f)f()}
  else if(t.id==="send"){cap()}
});
document.addEventListener("input",function(e){
  var el=e.target;if(el.dataset&&el.dataset.d){D[el.dataset.d]=el.value;if(bump(D))paintDraft();return}if(el.id==="q"){S.q=el.value;render();return}if(el.id==="cap"){$("#send").classList.toggle("on",!!el.value.trim());$("#kind").classList.toggle("on",words()>=3);paintDraft();return}
  var k=el.dataset&&el.dataset.k,box=el.closest&&el.closest(".detail");if(!k||!box)return;
  var i=find(box.dataset.id);if(!i)return;
  i[k]=el.value;i.u=Date.now();touchDay(i);var up=bump(i);paint(box,i);if(up)box.querySelector("#hint").textContent="Now a "+stg(i.s)[1].toLowerCase()+". It moves to "+stg(i.s)[2]+" when you close this card.";clearTimeout(window._d);window._d=setTimeout(save,500)
});
function cap(){var c=$("#cap");if(!c.value.trim())return;add(c.value,D.s);var it=S.items[S.items.length-1];["moment","why","small","qs","next"].forEach(function(f){it[f]=D[f].trim()});var k=it.s;ripple(k);c.value="";$("#send").classList.remove("on");$("#kind").classList.remove("on");resetDraft();save();render();say("Saved as "+(k==="inbox"?"a thought":k==="spark"?"a spark":"a seed")+".");c.focus()}
$("#q").addEventListener("keydown",function(e){if(e.key==="Escape")toggleSearch(false)});
$("#cap").addEventListener("keydown",function(e){if(e.key==="Enter")cap()});
$("#pr").addEventListener("keydown",function(e){if(e.target.id!=="pi")return;if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(P.step>=PR.length-1)cap();else advance()}else if(e.key==="Tab"&&!e.shiftKey&&P.step<PR.length-1){e.preventDefault();advance()}});
async function exportAll(){
  var out="# My ideas\n\n";
  ST.forEach(function(x){var l=by(x[0]);if(!l.length)return;out+="## "+x[2]+"\n\n";l.forEach(function(i){out+="- "+i.t+"\n";[["moment","The moment"],["why","Why now, why you"],["small","Smallest version"],["qs","Open questions"],["next","Next step"],["links","Links"],["decisions","Decisions"],["thing","The thing"]].forEach(function(f){if(i[f[0]])out+="  - "+f[1]+": "+i[f[0]]+"\n"})});out+="\n"});
  try{
    var d=window.claude&&await claude.use("downloads");
    if(!d){toast("Export isn’t available here",null);return}
    await d.save({filename:"ideas.md",data:out});toast("Export ready",null)
  }catch(e){toast("Export didn’t go through",null)}
}
var M={x:.5,y:.5,tx:.5,ty:.5,last:0,run:false};
function paintBg(){var b=$("#bg");b.hidden=S.view!=="home";if(!b.firstChild)b.innerHTML='<div class="rings" id="rings"><i class="rg r0"></i><div class="spot"><i class="rg r1"></i></div></div>';if(!b.hidden)startLoop()}
function paintStage(){var b=$("#bg");if(!b)return;b.dataset.st=D.s;if($("#cap").value.trim())b.setAttribute("data-on","");else b.removeAttribute("data-on")}
function ripple(k){var r=$("#rings");if(!r||$("#bg").hidden)return;var i=document.createElement("i");i.className="nr";i.style.setProperty("--c",k==="spark"?"var(--t2)":k==="seed"?"var(--t3)":"var(--fg)");r.appendChild(i);setTimeout(function(){i.remove()},2600)}
function startLoop(){if(!M.run){M.run=true;requestAnimationFrame(frame)}}
function frame(now){
  if(S.view!=="home"||document.hidden){M.run=false;return}
  var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!rm&&now-M.last>4000){var t=now/1000;M.tx=.5+.28*Math.sin(t*.23)+.1*Math.sin(t*.61);M.ty=.5+.26*Math.cos(t*.19)+.1*Math.sin(t*.47)}
  var k=rm?1:.07;M.x+=(M.tx-M.x)*k;M.y+=(M.ty-M.y)*k;
  var r=$("#rings");
  if(r){var q=r.getBoundingClientRect();r.style.setProperty("--mx",(M.x*innerWidth-q.left)+"px");r.style.setProperty("--my",(M.y*innerHeight-q.top)+"px");
    if(!rm){r.style.setProperty("--tx",((M.x-.5)*-28)+"px");r.style.setProperty("--ty",((M.y-.5)*-28)+"px");r.style.setProperty("--rot",((M.x-.5)*3)+"deg")}}
  requestAnimationFrame(frame)
}
addEventListener("pointermove",function(e){M.tx=e.clientX/innerWidth;M.ty=e.clientY/innerHeight;M.last=performance.now()});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.view==="home")startLoop()});
addEventListener("hashchange",route);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ref)sync()});
addEventListener("online",function(){if(ref)sync()});
resetDraft();route();setSync(window.claude?"":"Saved on this device");
(async function(){
  try{
    if(!window.claude)return;
    var u=await claude.use("user"),db=await claude.use("db");if(!u||!db){S.loading=false;setSync("Saved on this device");render();return}
    var id=await u.id();if(!id){S.loading=false;setSync("Saved on this device");render();return}
    ref=db.collection("data/users/"+id).doc("ideas");
    setSync("Syncing…");
    await Promise.race([sync(),new Promise(function(_,j){setTimeout(j,10000)})]);
  }catch(e){setSync("Saved on this device")}
  S.loading=false;render()
})();
</script>
